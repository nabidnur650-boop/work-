[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eviaudio-mt"
version = "0.1.0"
description = "Evidence-grounded streaming audio-text research prototype with Mamba-style temporal modeling and fast memory"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "PyYAML>=6.0", "torch>=2.2", "tqdm>=4.66"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
